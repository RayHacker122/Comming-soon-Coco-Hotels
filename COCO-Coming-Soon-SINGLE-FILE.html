<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600&family=Inter:wght@400;500&display=swap">
<style>
:root{--ch:#C8B69D;--iv:#F7F4EE;--cr:#EAE1D4;--wa:#604A39;--es:#30251F;--go:#B69A68;--gr:#8D857C;--bd:#dccfbb;--hh:calc(150px + env(safe-area-inset-top,0px))}
*{box-sizing:border-box;margin:0}html{scroll-behavior:smooth}
body{font:400 16px/1.7 Inter,system-ui,sans-serif;color:var(--es);background:var(--iv);-webkit-font-smoothing:antialiased;overflow-x:hidden}
h1,h2,h3{font-family:'Cormorant Garamond',Georgia,serif;font-weight:500;line-height:1.08;letter-spacing:.01em}h1{font-size:clamp(2.3rem,4.6vw,4.2rem)}h2{font-size:clamp(2rem,4vw,3.3rem)}h3{font-size:1.55rem}
img{display:block;max-width:100%}a{color:inherit}:focus-visible{outline:2px solid var(--go);outline-offset:3px}
.wrap{max-width:1240px;margin:0 auto;padding:0 clamp(20px,5vw,48px)}.sec{padding:clamp(64px,9vw,120px) 0}
.eb{font-size:.7rem;letter-spacing:.28em;text-transform:uppercase;color:var(--wa);display:flex;align-items:center;gap:14px;margin-bottom:18px}.eb:before{content:"";width:34px;height:1px;background:var(--go)}
.btn{display:inline-flex;align-items:center;justify-content:center;padding:0 28px;min-height:50px;font:500 .72rem Inter,sans-serif;letter-spacing:.2em;text-transform:uppercase;text-decoration:none;border:1px solid var(--es);background:var(--es);color:var(--iv);cursor:pointer;transition:.3s}
.btn:hover{background:var(--go);border-color:var(--go);color:var(--es)}.btn.gh{background:transparent;color:inherit;border-color:currentColor}.btn.gh:hover{background:var(--iv);color:var(--es);border-color:var(--iv)}.btn.dk{color:var(--es)}.btn.dk:hover{background:var(--es);color:var(--iv);border-color:var(--es)}.btn.gd{background:var(--go);border-color:var(--go);color:var(--es)}.btn.gd:hover{background:var(--iv);border-color:var(--iv)}.btn.sm{min-height:42px;padding:0 18px}
.lk{font-size:.72rem;letter-spacing:.2em;text-transform:uppercase;text-decoration:none;border-bottom:1px solid var(--go);padding-bottom:4px;font-weight:500}.bs{display:flex;gap:12px;flex-wrap:wrap}
/* header */
header{position:fixed;top:0;left:0;right:0;z-index:50;padding-top:env(safe-area-inset-top,0px);color:var(--es);background:var(--iv);border-bottom:1px solid var(--bd);transition:background .5s,color .5s,border-color .5s}

<style>
/* Coming-soon screen: uses the original COCO palette and Cormorant/Inter typography. */
html, body { min-height: 100%; }
body.coming-soon-page {
  margin: 0;
  min-height: 100vh;
  background: var(--iv, #F7F4EE);
  color: var(--es, #30251F);
}
.cs-page {
  min-height: 100vh;
  min-height: 100svh;
  display: flex;
  flex-direction: column;
}
.cs-header {
  min-height: 150px;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 28px 24px;
  border-bottom: 1px solid var(--bd, #dccfbb);
  background: var(--iv, #F7F4EE);
}
.cs-brand {
  display: flex;
  flex-direction: column;
  align-items: center;
  text-align: center;
  color: var(--es, #30251F);
  text-decoration: none;
}
.cs-brand-name {
  font-family: 'Cormorant Garamond', Georgia, serif;
  font-weight: 500;
  font-size: clamp(2.5rem, 6vw, 4.5rem);
  letter-spacing: .22em;
  line-height: 1;
  padding-left: .22em;
}
.cs-brand-sub {
  margin-top: 12px;
  font-family: Inter, sans-serif;
  font-size: .72rem;
  font-weight: 400;
  letter-spacing: .46em;
  text-transform: uppercase;
  padding-left: .46em;
  color: var(--wa, #604A39);
}
.cs-main {
  flex: 1;
  display: grid;
  place-items: center;
  text-align: center;
  padding: clamp(60px, 12vh, 140px) 24px;
  background: var(--cr, #EAE1D4);
  border-bottom: 1px solid var(--bd, #dccfbb);
}
.cs-content { width: min(100%, 1200px); }
.cs-eyebrow {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 14px;
  margin-bottom: clamp(24px, 4vh, 42px);
  color: var(--wa, #604A39);
  font-family: Inter, sans-serif;
  font-size: .72rem;
  letter-spacing: .34em;
  text-transform: uppercase;
}
.cs-eyebrow::before, .cs-eyebrow::after {
  content: "";
  width: 34px;
  height: 1px;
  background: var(--go, #B69A68);
}
.cs-title {
  margin: 0;
  font-family: 'Cormorant Garamond', Georgia, serif;
  font-size: clamp(4.4rem, 14vw, 12rem);
  line-height: .78;
  font-weight: 400;
  letter-spacing: -.035em;
  text-transform: uppercase;
}
.cs-title span { display: block; }
.cs-title span + span {
  margin-top: .15em;
  color: var(--go, #B69A68);
}
.cs-description {
  max-width: 520px;
  margin: clamp(32px, 5vh, 54px) auto 0;
  font-family: Inter, sans-serif;
  color: var(--wa, #604A39);
  font-size: clamp(.9rem, 1.4vw, 1.05rem);
  line-height: 1.9;
}
.cs-footer {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 12px;
  min-height: 76px;
  padding: 20px;
  background: var(--iv, #F7F4EE);
  color: var(--gr, #8D857C);
  font-family: Inter, sans-serif;
  font-size: .65rem;
  letter-spacing: .2em;
  text-transform: uppercase;
  text-align: center;
}

@media (max-width: 600px) {
  .cs-header { min-height: 120px; }
  .cs-brand-name { letter-spacing: .15em; padding-left: .15em; }
  .cs-brand-sub { letter-spacing: .3em; padding-left: .3em; }

  .cs-footer { font-size: .58rem; letter-spacing: .12em; }
}

  .cs-brand-sub { margin-top: 7px; font-size: .5rem; letter-spacing: .25em; padding-left: .25em; }
}
